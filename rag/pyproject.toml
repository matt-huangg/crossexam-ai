[project]
name = "crossexam-rag"
version = "0.1.0"
description = "Corpus ingestion, embedding, and retrieval pipeline for CrossExam AI"
requires-python = ">=3.11"

# - talk to Amazon Bedrock (Titan embedding model)                  -> boto3
# - store/query embeddings in a local Chroma vector store           -> chromadb
# - extract text from decision PDFs                                 -> pymupdf
# - fetch statute/CFR text from public HTTP APIs                    -> httpx
# - parse statute HTML from uscode.house.gov                        -> beautifulsoup4 + lxml
dependencies = [
    "boto3>=1.34",
    "chromadb>=0.5",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
