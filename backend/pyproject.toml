[project]
name = "crossexam-backend"
version = "0.1.0"
description = "LangGraph cross-examination drill agent for CrossExam AI"
requires-python = ">=3.11"

# - LangGraph state machine (nodes, edges, shared drill state) -> langgraph
# - Message types for the transcript (HumanMessage, AIMessage) -> langchain-core
# - ChatBedrock wraps boto3's bedrock-runtime client and returns AIMessage
#   directly, matching DrillState's add_messages reducer -> langchain-aws
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-aws>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
